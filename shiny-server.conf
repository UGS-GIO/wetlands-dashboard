# shiny-server.conf
run_as shiny;
server {
  listen 8080;
  
  # Keep websockets enabled for better performance
  # disable_protocols websocket xdr-streaming xhr-streaming iframe-eventsource iframe-htmlfile xdr-polling iframe-xhr-polling;
  
  location / {
    site_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;
    directory_index off;
    
    # Increase timeout and buffer settings
    app_init_timeout 120;
    app_idle_timeout 120;
    
    # Allow reconnections with state preservation
    reconnect true;
    
    # Increase buffer size for reconnections
    sockjs_disconnect_delay 60;
  }
}