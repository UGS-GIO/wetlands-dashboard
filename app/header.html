<script>
// Send active tab to Shiny when tabs change
$(document).ready(function() {
  $(document).on('shown.bs.tab', 'a[data-toggle="tab"]', function(e) {
    var tabId = $(e.target).attr('href');
    if (typeof Shiny !== 'undefined') {
      Shiny.setInputValue('active_tab', tabId, {priority: 'event'});
    }
  });

  // Make logo clickable
  $('.navbar-logo img').wrap('<a href="https://geology.utah.gov/water/wetlands/" target="_blank" style="display: block;"></a>');
  $('.navbar-logo a').css('cursor', 'pointer');
});

// Handler to invalidate Leaflet map size when called from R
Shiny.addCustomMessageHandler('invalidateLeafletMap', function(mapId) {
  setTimeout(function() {
    var container = document.getElementById(mapId);
    if (container) {
      var map = HTMLWidgets.find('#' + mapId);
      if (map && map.getMap) {
        map.getMap().invalidateSize();
      }
    }
  }, 100);
});
</script>
